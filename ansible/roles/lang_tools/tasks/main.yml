---
# ---------------------------------------------
# nvm / Node.js
#   nvmはシェル関数なので、どのタスクも nvm.sh を読み込んでから叩く必要がある
# ---------------------------------------------
- name: nvmを入れる
  ansible.builtin.shell: |
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/{{ nvm_version }}/install.sh | bash
  args:
    creates: "{{ home_dir }}/.nvm/nvm.sh"
    executable: /bin/bash

- name: nodeのバージョンを確認する
  ansible.builtin.shell: . "{{ home_dir }}/.nvm/nvm.sh" && node --version
  args:
    executable: /bin/bash
  register: node_check
  changed_when: false
  failed_when: false
  check_mode: false # 状態を見るだけなので --check でも実行する

# 未導入のときだけでなく、node_min_version(Slidevの要件)に届かないときも入れ直す。
# --reinstall-packages-from は移行元が要るので既存版があるときだけ付ける。
# nvmはグローバルパッケージをバージョンごとに持つため、移行しないとclaude-code等が消える
- name: Node.js(LTS)を入れる
  ansible.builtin.shell: |
    . "{{ home_dir }}/.nvm/nvm.sh"
    nvm install --lts {{ '--reinstall-packages-from=current' if node_check.rc == 0 else '' }}
    nvm alias default 'lts/*'
  args:
    executable: /bin/bash
  # rcが0でないときstdoutは空なので、バージョン比較まで進まないようorの左側で先に弾く
  when: node_check.rc != 0 or
        node_check.stdout | regex_replace('^v', '') is version(node_min_version, '<')

# currentではなくdefaultを見る。ansibleを起動したシェルに古いnodeが読み込まれていると
# currentがそちらを指してしまい、更新前のnpmでインストールしてしまうため
# (npm 8ではオプショナル依存の取りこぼしが起きる。rolldown等のネイティブバイナリが入らない)
- name: nvm配下のnpmのパスを調べる
  ansible.builtin.shell: . "{{ home_dir }}/.nvm/nvm.sh" && dirname "$(nvm which default)"
  args:
    executable: /bin/bash
  register: nvm_bin
  changed_when: false
  check_mode: false
  # 本実行では直前でnodeが入っているので失敗したら異常。
  # --check ではnvm自体が未導入のことがあるので、そこだけ許容する
  failed_when: nvm_bin.rc != 0 and not ansible_check_mode

- name: npmのグローバルパッケージを入れる
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: present
  environment:
    PATH: "{{ nvm_bin.stdout }}:{{ ansible_env.PATH }}"
  loop: "{{ npm_globals }}"
  when: nvm_bin.rc == 0

# Slidev一式。~/slides からは node_modules と package.json のリンク越しに使うので、
# インストール自体はdotfiles側で行い、package-lock.jsonもdotfilesで管理する
- name: Slidevワークスペースの依存を入れる
  community.general.npm:
    path: "{{ dotfiles_dir }}/slidev"
  environment:
    PATH: "{{ nvm_bin.stdout }}:{{ ansible_env.PATH }}"
  when: nvm_bin.rc == 0

# slidev exportはplaywrightのChromiumで描画する。npm installのpostinstallでは
# ブラウザ本体まで落ちてこないので、明示的に入れる(~/.cache/ms-playwrightに入る)
- name: SlidevのPDF出力に使うChromiumを入れる
  ansible.builtin.command: npx playwright install chromium
  args:
    chdir: "{{ dotfiles_dir }}/slidev"
    creates: "{{ home_dir }}/.cache/ms-playwright"
  environment:
    PATH: "{{ nvm_bin.stdout }}:{{ ansible_env.PATH }}"
  when: nvm_bin.rc == 0

# ---------------------------------------------
# Go / pipx
# ---------------------------------------------
- name: Go製のCLIを入れる
  ansible.builtin.command: go install {{ item.module }}
  args:
    creates: "{{ home_dir }}/go/bin/{{ item.name }}"
  loop: "{{ go_packages }}"
  loop_control:
    label: "{{ item.name }}"

- name: pipxのパッケージを入れる
  community.general.pipx:
    name: "{{ item }}"
    state: present
  loop: "{{ pipx_packages }}"

# ---------------------------------------------
# 公式インストーラを使うもの
# ---------------------------------------------
- name: fzfを取得する # aptの版は機能が古いので公式のものを使う
  ansible.builtin.git:
    repo: https://github.com/junegunn/fzf.git
    dest: "{{ home_dir }}/.fzf"
    depth: 1
    version: master
    update: false

- name: fzfを入れる
  ansible.builtin.command: "{{ home_dir }}/.fzf/install --all"
  args:
    creates: "{{ home_dir }}/.fzf/bin/fzf"

- name: starshipを入れる # ユーザー領域に入れるのでsudo不要
  ansible.builtin.shell: |
    curl -sS https://starship.rs/install.sh | sh -s -- -y -b "{{ home_dir }}/.local/bin"
  args:
    creates: "{{ home_dir }}/.local/bin/starship"

# tabctl本体はrelease_bins(user_files)で~/.local/binに配置済み。
# ここで書くマニフェストにはmediatorの絶対パスが載るので、置き場所を変えたら登録し直す
- name: tabctlのネイティブメッセージングホストを登録する
  ansible.builtin.command: "{{ home_dir }}/.local/bin/tabctl install"
  args:
    creates: "{{ home_dir }}/.config/google-chrome/NativeMessagingHosts/tabctl_mediator.json"

- name: ghの拡張を入れる
  ansible.builtin.command: gh extension install {{ item.repo }}
  args:
    creates: "{{ home_dir }}/.local/share/gh/extensions/{{ item.name }}"
  loop: "{{ gh_extensions }}"
  loop_control:
    label: "{{ item.name }}"
