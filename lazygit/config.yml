customCommands:
  - key: "<c-g>"
    context: "files"
    description: "AIでtype/subjectを判定してgit-czを開く(scope等は対話入力のまま)"
    command: "~/dotfiles/scripts/ai-commit-msg.sh"
    output: terminal
  - key: "<c-x>"
    context: "commits"
    description: "未pushのコミットをAIでスカッシュ+メッセージ生成(元コミット一覧はbodyに残す)"
    command: "~/dotfiles/scripts/ai-squash-commit.sh"
    output: terminal
gui:
  language: "ja"
  showIcons: true
  nerdFontsVersion: "3"
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
  branchLogCmd: "git log --graph --color=always --pretty='%Cred%h%Creset -%C(auto)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' {{branchName}} --"
  allBranchesLogCmds:
    - git log --graph --color=always --pretty='%Cred%h%Creset -%C(auto)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' --all
