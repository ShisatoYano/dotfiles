# Starshipプロンプト用の色設定
# (WezTermのカラースキームとは独立した、プロンプト専用の配色)

format = """
$directory\
$python\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$time\
\n$character
"""

# コマンドラインに1行分のスペースを入れる
add_newline = true

palette = "starship_palette"

# 右端のcmd_duration/timeまでを横線で埋める
[fill]
symbol = "┄"

[palettes.starship_palette]
background = "#2d2a2e"
text = "#fcfcfa"
accent1 = "#ff6188" # red/pink
accent2 = "#fc9867" # orange
accent4 = "#a9dc76" # green
accent5 = "#78dce8" # cyan
accent6 = "#ab9df2" # purple
dimmed1 = "#c1c0c0"
dimmed5 = "#403e41"

[directory]
style = "fg:background bg:accent5 bold"
truncation_length = 10
truncate_to_repo = false
truncation_symbol = "…/"
read_only = " 󰌾 "
read_only_style = "fg:accent1 bg:dimmed5"
format = "[](fg:accent5)[ $path ]($style)[$read_only]($read_only_style)[](fg:accent5)"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[python]
# 仮想環境が常時有効(.bashrcで自動activate)なため、
# ディレクトリの中身(detect_files/detect_extensions)だけで判定する
detect_env_vars = []
style = "fg:background bg:accent6 bold"
format = "[](fg:accent6)[$symbol$virtualenv ]($style)[](fg:accent6)"

[aws]
disabled = true
[gcloud]
disabled = true

[git_branch]
symbol = ""
style = "bg:accent4"
format = "[](fg:accent4)[[ $symbol $branch ](fg:background bg:accent4)]($style)"

[git_status]
style = "bg:accent4"
format = "[[($all_status$ahead_behind )](fg:background bg:accent4)]($style)[](fg:accent4)"

[cmd_duration]
min_time = 1
style = "fg:accent2"
format = "[$duration]($style)"

[time]
disabled = false
time_format = "%R"
format = "[  $time ](fg:dimmed1)"

[character]
success_symbol = "[❯](bold accent4)"
error_symbol = "[❯](bold accent1)"
vimcmd_symbol = "[V](bold accent4) "
